<article class="panel h-full px-5 py-4">
  <div class="flex items-center justify-between gap-3">
    <p class="text-xs font-medium text-slate-500">{{ label() }}</p>
    <span class="metric-icon" [attr.data-tone]="tone()"
      ><svg [lucideIcon]="icon()" [size]="17" aria-hidden="true"></svg
    ></span>
  </div>
  <div
    class="mt-2 text-[27px] leading-tight font-semibold tracking-tight tabular-nums"
    [class.text-emerald-700]="tone() === 'green'"
  >
    @if (money()) {
      <app-money-display [amount]="value()" />
    } @else {
      {{ value() }}
    }
  </div>
  @if (context()) {
    <p class="mt-3 text-[11px] flex items-center gap-1.5" [attr.data-tone]="contextTone()">
      @if (contextTone() === 'green') {
        <svg lucideIcon="trending-up" [size]="13" aria-hidden="true"></svg>
      }
      @if (contextTone() === 'amber') {
        <svg lucideIcon="clock" [size]="13" aria-hidden="true"></svg>
      }
      {{ context() }}
    </p>
  }
</article>
