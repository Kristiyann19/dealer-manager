<section class="panel overflow-hidden h-full" aria-labelledby="active-title">
  <div class="section-heading !mb-0 px-5 py-4 border-b border-slate-100">
    <div class="flex items-center gap-2.5">
      <h2 id="active-title">Active Vehicles</h2>
      <span class="count-pill">{{ vehicles().length }}</span>
    </div>
    <a routerLink="/vehicles" class="text-link"
      >View all <svg lucideIcon="arrow-up-right" [size]="14" aria-hidden="true"></svg
    ></a>
  </div>
  <div class="divide-y divide-slate-100">
    @for (vehicle of filtered(); track vehicle.id) {
      <article class="px-5 py-4">
        <div class="flex flex-wrap justify-between items-center gap-2">
          <h3 class="text-xs font-semibold text-slate-800">{{ vehicle.vehicle }}</h3>
          <app-status-badge [status]="vehicle.status" />
        </div>
        <div class="mt-3 grid grid-cols-2 gap-4 text-[11px]">
          <div>
            <p class="text-slate-400">Spent so far</p>
            <p class="mt-1 font-medium"><app-money-display [amount]="vehicle.spentSoFar" /></p>
          </div>
          <div class="text-right">
            <p class="text-slate-400">
              {{ vehicle.isFinalCost ? 'Final Cost' : 'Projected Total' }}
            </p>
            <p class="mt-1 font-medium"><app-money-display [amount]="vehicle.projectedTotal" /></p>
          </div>
        </div>
        <div
          class="mt-2.5 h-1.5 rounded-full bg-slate-100 overflow-hidden"
          role="progressbar"
          [attr.aria-label]="vehicle.vehicle + ' costs incurred'"
          [attr.aria-valuenow]="vehicle.spendingPercent"
          aria-valuemin="0"
          aria-valuemax="100"
        >
          <div
            class="h-full rounded-full"
            [class.bg-emerald-500]="vehicle.isFinalCost"
            [class.bg-blue-500]="!vehicle.isFinalCost"
            [style.width.%]="vehicle.spendingPercent"
          ></div>
        </div>
        <div class="mt-2.5 flex justify-between gap-2 text-[10px]">
          <span class="text-slate-500"
            >Expected sale
            <strong class="ml-1 font-medium text-slate-700"
              ><app-money-display [amount]="vehicle.expectedSale" /></strong></span
          ><span class="text-slate-500"
            >Projected profit
            <strong class="ml-1 font-semibold text-emerald-700"
              ><app-money-display [amount]="vehicle.projectedProfit" /></strong
          ></span>
        </div>
      </article>
    } @empty {
      <p class="px-5 py-10 text-center text-sm text-slate-500">
        No active vehicles match your search.
      </p>
    }
  </div>
</section>
