<section class="panel p-6" aria-labelledby="estimate-title">
  <div class="section-heading">
    <h2 id="estimate-title">{{ 'ui.new_estimate_version' | translate }}</h2>
  </div>
  <form [formGroup]="form" (ngSubmit)="submit()">
    @if (error()) {
      <div class="error-banner mb-5" role="alert">{{ error() | translate }}</div>
    }
    <fieldset [disabled]="busy()">
      @if (candidate().latestEstimate) {
        <button type="button" class="secondary-button mb-5" (click)="copyLatest()">
          {{ 'ui.replace_draft_items_with_latest_estimate' | translate }}
        </button>
      }
      <div class="max-w-sm mb-5">
        <label class="field-label" for="estimate-price">{{
          'ui.expected_selling_price_eur' | translate
        }}</label
        ><input
          id="estimate-price"
          class="form-input"
          type="number"
          min="0"
          step="0.01"
          formControlName="expectedSellingPrice"
          aria-required="true"
          aria-describedby="estimate-price-error"
        /><app-field-error
          id="estimate-price-error"
          [control]="form.controls.expectedSellingPrice"
          [message]="'ui.enter_a_selling_price_of_zero_or_more' | translate"
        />
      </div>
      <div formArrayName="items" class="space-y-3">
        @for (item of items.controls; track item; let i = $index) {
          <div
            [formGroupName]="i"
            class="estimate-item"
            [attr.aria-describedby]="isFixedPurchase(i) ? 'purchase-cost-help' : null"
          >
            <div>
              <label class="field-label" [for]="'category-' + i">{{
                'ui.category' | translate
              }}</label
              ><select class="form-input" [id]="'category-' + i" formControlName="category">
                @for (
                  category of hasFixedPurchase() && !isFixedPurchase(i)
                    ? additionalCategories
                    : categories;
                  track category.value
                ) {
                  <option [ngValue]="category.value">{{ category.label | translate }}</option>
                }
              </select>
            </div>
            <div>
              <label class="field-label" [for]="'description-' + i">{{
                'ui.description' | translate
              }}</label
              ><input
                class="form-input"
                [id]="'description-' + i"
                formControlName="description"
                [placeholder]="'ui.e_g_fuel_system_repair' | translate"
                [attr.aria-describedby]="'description-error-' + i"
              /><app-field-error
                [id]="'description-error-' + i"
                [control]="item.controls.description"
                [message]="'ui.description_is_required' | translate"
              />
            </div>
            <div>
              <label class="field-label" [for]="'amount-' + i">{{
                'ui.estimated_amount' | translate
              }}</label
              ><input
                class="form-input"
                [id]="'amount-' + i"
                type="number"
                min="0"
                step="0.01"
                formControlName="estimatedAmount"
                [attr.aria-describedby]="'amount-error-' + i"
              /><app-field-error
                [id]="'amount-error-' + i"
                [control]="item.controls.estimatedAmount"
                [message]="'ui.enter_an_amount_of_zero_or_more' | translate"
              />
            </div>
            <button
              type="button"
              class="secondary-button self-start mt-6"
              [disabled]="items.length === 1 || isFixedPurchase(i)"
              [attr.aria-label]="'candidate.removeItem' | translate: { index: i + 1 }"
              (click)="removeItem(i)"
            >
              {{ 'ui.remove' | translate }}
            </button>
          </div>
        }
      </div>
      <button type="button" class="primary-button mt-4" (click)="addItem()">
        {{ 'ui.add_cost_item' | translate }}
      </button>
      <div class="mt-5">
        <label class="field-label" for="estimate-notes">{{ 'ui.estimate_notes' | translate }}</label
        ><textarea
          class="form-input"
          id="estimate-notes"
          rows="3"
          formControlName="notes"
          [placeholder]="'ui.what_changed_and_why' | translate"
        ></textarea>
      </div>
      <div class="mt-6 flex flex-wrap justify-end gap-3">
        <button type="button" class="secondary-button" (click)="cancelled.emit()">
          {{ 'ui.cancel_estimate' | translate }}</button
        ><button type="submit" class="primary-button" [disabled]="busy()">
          {{ busy() ? ('common.saving' | translate) : ('candidate.saveVersion' | translate) }}
        </button>
      </div>
    </fieldset>
  </form>
</section>
