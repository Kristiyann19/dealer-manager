<aside class="flex h-full flex-col bg-white border-r border-slate-200">
  <a
    routerLink="/dashboard"
    (click)="navigate.emit()"
    class="flex items-center gap-3 px-6 py-7"
    aria-label="AutoCapital dashboard"
  >
    <span class="brand-mark"
      ><svg lucideIcon="car-front" [size]="23" aria-hidden="true"></svg
    ></span>
    <span
      ><span class="block text-lg font-bold tracking-tight text-slate-900"
        >AutoCapital<span class="text-blue-600">.</span></span
      ><span class="block text-[10px] text-slate-400 tracking-[0.1em] uppercase mt-0.5"
        >Dealership ERP</span
      ></span
    >
  </a>
  <p class="px-7 mt-4 mb-3 text-[10px] uppercase font-semibold tracking-[0.13em] text-slate-400">
    Workspace
  </p>
  <nav class="space-y-1 px-3" aria-label="Main navigation">
    @for (link of links; track link.path) {
      <a
        [routerLink]="link.path"
        routerLinkActive="nav-active"
        ariaCurrentWhenActive="page"
        (click)="navigate.emit()"
        class="nav-link"
      >
        <svg [lucideIcon]="link.icon" [size]="18" aria-hidden="true"></svg
        ><span>{{ link.label }}</span>
      </a>
    }
  </nav>
  <div class="mt-auto px-3 pt-8 pb-4">
    <a
      routerLink="/settings"
      routerLinkActive="nav-active"
      ariaCurrentWhenActive="page"
      (click)="navigate.emit()"
      class="nav-link"
      ><svg lucideIcon="settings" [size]="18" aria-hidden="true"></svg>Settings</a
    >
    <div class="mx-3 mt-5 border-t border-slate-100 pt-5 flex items-center gap-3">
      <span class="avatar bg-slate-100 text-slate-600">{{ workspace.user.initials }}</span>
      <div>
        <p class="text-xs font-semibold text-slate-800">{{ workspace.user.name }}</p>
        <p class="text-[10px] text-slate-400 mt-1">{{ workspace.user.role }}</p>
      </div>
      <span class="ml-auto h-2 w-2 rounded-full bg-emerald-500" aria-label="Demo profile"></span>
    </div>
  </div>
</aside>
